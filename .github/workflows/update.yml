name: Refresh data and deploy

on:
  schedule:
    # every 30 minutes (UTC), offset from :00 and :30, which GitHub delays the most
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit data/history.json once a day
  pages: write
  id-token: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Fetch latest NEA data, hotspots and headlines
        run: node scripts/update.mjs

      - name: Daily PSI and PM2.5 for this year vs last year (at most 12 NEA calls, then 1 a day)
        run: node scripts/daily.mjs

      - name: Build site
        run: node scripts/build.mjs

      - name: Save daily history (about one commit a day)
        run: |
          if ! git diff --quiet -- data/history.json data/daily.json; then
            git config user.name "sgairquality-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json data/daily.json
            git commit -m "data: daily PSI, PM2.5 and hotspot history"
            git pull --rebase --autostash && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
